<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D 隔离导入审核</title>
<style>body{margin:0;background:#f3f5f7;color:#172636;font:15px system-ui}header{background:#14334a;color:white;padding:22px 4%}main{max-width:1500px;margin:auto;padding:20px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #b6c3cb;border-radius:5px}button{background:#155c75;color:white;cursor:pointer}section,article{background:white;padding:18px;margin:12px 0;border:1px solid #d4dfe5;border-radius:8px}.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(330px,1fr);gap:18px}.pages img{width:100%}.asset{max-width:100%;max-height:330px}.warn{color:#994419;white-space:pre-wrap}.text{white-space:pre-wrap;line-height:1.7}.muted{color:#58707d}nav{display:flex;gap:10px;flex-wrap:wrap}a{color:#08748e}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:95%;min-height:50px}@media(max-width:800px){.grid{display:block}}</style>
<header><h1>D 隔离导入审核</h1><div>完整原页读取文字 · Region 固定图像资产 · 仅保存到隔离草稿</div></header><main>
<section><form id="upload"><input type="file" name="file" required accept=".pdf,.docx,.png,.jpg,.jpeg"><select name="subject"><option>数学</option><option>物理</option></select><label>起页 <input name="start" type="number" min="1" value="1" style="width:60px"></label><label>末页（0=全文） <input name="end" type="number" min="0" value="0" style="width:60px"></label><button>运行 D 隔离导入</button></form><p class="muted">本页上传调用现有 /api/import 的 d_shadow 模式。不会写入正式题库，不自动生成答案。DOCX 暂保留原生资产并提示分页不支持。</p></section>
<nav id="runs"></nav><section id="status">选择文件或已有运行</section><div id="content"></div></main>
<script>
const $=id=>document.getElementById(id);let active=new URLSearchParams(location.search).get('id'),record;
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function url(path){return '/api/d-shadow/'+active+'/artifacts/'+path.split('/').map(encodeURIComponent).join('/')}
function assetPath(a){return 'regions/'+a.source_pages[0]+'/'+a.asset}
async function refreshRuns(){let list=await fetch('/api/d-shadow').then(r=>r.json());$('runs').replaceChildren();list.forEach(r=>{let b=el('button',r.display_name+' · '+r.status);b.onclick=()=>{active=r.id;history.replaceState({},'', '?id='+active);load()};$('runs').append(b)})}
function blocks(b){return b.map(v=>v.kind==='image'?'':v.kind==='equation'?v.latex:(v.spans||[]).map(x=>x.text).join('')).join('\n')}
async function load(){if(!active)return;record=await fetch('/api/d-shadow/'+active).then(r=>r.json());let r=record;$('status').replaceChildren(el('h2',r.display_name+' · '+r.status),el('div','题目 '+r.questions.length+' | '+JSON.stringify(r.counts||{})+' | 正式DB写入 '+r.production_db_writes));if(r.metrics)$('status').append(el('p','请求 '+r.metrics.requests+' · 耗时 '+Math.round(r.wall_seconds||0)+'s · 估算费用 '+(r.metrics.cost_cny_estimate??'未知')+' 元'));if(r.errors?.length)$('status').append(el('pre',JSON.stringify(r.errors,null,2),'warn'));if(r.error)$('status').append(el('p',r.error,'warn'));let dl=el('a','完整 JSON / 成本证据');dl.href='/api/d-shadow/'+active;$('status').append(dl);
if(['running','queued'].includes(r.status)){let b=el('button','取消');b.onclick=async()=>{await fetch('/api/d-shadow/'+active+'/cancel',{method:'POST'});load()};$('status').append(b)}
$('content').replaceChildren();let grid=el('div',undefined,'grid'),pages=el('div',undefined,'pages'),qs=el('div');grid.append(pages,qs);$('content').append(grid);
for(let p of r.pages){let card=el('article');card.append(el('h3','原始页 '+p.page+' · '+p.classification));let img=el('img');img.src=url('regions/'+p.page+'/'+p.original);card.append(img);let details=el('details');details.append(el('summary','查看 Region overlay'));let overlay=el('img');overlay.src=url('regions/'+p.page+'/'+p.overlay);details.append(overlay);card.append(details);pages.append(card)}
for(let q of r.questions){let card=el('article');card.append(el('h3','#'+q.source_order+' · '+(q.source_number||'无印刷题号')+' · '+q.draft_status),el('p','source_pages: '+q.source_pages.join(', ')+' · '+q.cross_page_status,'muted'),el('div',blocks(q.stem),'text'));for(let o of q.options)card.append(el('div',o.label+' '+blocks(o.blocks),'text'));for(let s of q.subquestions)card.append(el('div',s.label+' '+blocks(s.blocks),'text'));for(let a of q.asset_refs){card.append(el('p',a.asset_id+' · '+a.asset_type+' / '+a.semantic_role));let img=el('img',undefined,'asset');img.src=url(assetPath(a));card.append(img);for(let t of a.associated_text)card.append(el('p','关联文字（来自完整原页；未宣称PNG已包含）：'+t,'text'))}if(q.warning.length)card.append(el('pre',q.warning.join('\n'),'warn'));let note=el('textarea');note.value=q.review_note||'';note.placeholder='记录人工核对结果（仅存隔离草稿）';let save=el('button','保存核对备注');save.onclick=async()=>{let res=await fetch('/api/d-shadow/'+active+'/questions/'+q.id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:q.revision,note:note.value})});if(!res.ok)alert(await res.text());else load()};card.append(note,save);qs.append(card)}
if(['running','queued'].includes(r.status))setTimeout(load,4000)}
$('upload').onsubmit=async e=>{e.preventDefault();let data=new FormData(e.target);data.set('mode','d_shadow');$('status').textContent='上传中…';let res=await fetch('/api/import',{method:'POST',body:data});if(!res.ok){$('status').textContent=await res.text();return}let r=await res.json();active=r.id;history.replaceState({},'','?id='+active);refreshRuns();load()};refreshRuns();load();
</script></html>
